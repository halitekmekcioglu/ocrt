<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DataMatrix Scanner Pro</title>

<style>
:root{
  --bg:#0b0b0b;
  --card:#161616;
  --line:#2d2d2d;
  --accent:#79f28a;
  --accent2:#6bc7ff;
  --text:#f1f1f1;
  --muted:#8b8b8b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

.header{
  height:72px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}

.logo{
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.5px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--card);
  border:1px solid var(--line);
  padding:10px 14px;
  border-radius:999px;
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{opacity:1}
  50%{opacity:.2}
  100%{opacity:1}
}

.viewport{
  flex:1;
  position:relative;
  margin:0 14px;
  overflow:hidden;
  border-radius:24px;
  background:black;
  border:1px solid var(--line);
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.scan-box{
  position:absolute;
  width:260px;
  height:260px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:2px solid rgba(107,199,255,.7);
  border-radius:18px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.45);
}

.corner{
  position:absolute;
  width:40px;
  height:40px;
  border-color:var(--accent);
  border-style:solid;
  border-width:0;
}

.tl{
  top:-2px;
  left:-2px;
  border-top-width:4px;
  border-left-width:4px;
  border-radius:18px 0 0 0;
}

.tr{
  top:-2px;
  right:-2px;
  border-top-width:4px;
  border-right-width:4px;
}

.bl{
  bottom:-2px;
  left:-2px;
  border-bottom-width:4px;
  border-left-width:4px;
}

.br{
  bottom:-2px;
  right:-2px;
  border-bottom-width:4px;
  border-right-width:4px;
}

.scan-line{
  position:absolute;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent2),transparent);
  animation:scan 2s linear infinite;
}

@keyframes scan{
  0%{top:0%}
  100%{top:100%}
}

.result{
  position:absolute;
  left:16px;
  right:16px;
  bottom:16px;
  background:rgba(20,20,20,.95);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  backdrop-filter:blur(20px);
  transform:translateY(120%);
  transition:.3s;
}

.result.show{
  transform:translateY(0);
}

.result-type{
  font-size:11px;
  color:var(--accent2);
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:.15em;
}

.result-text{
  font-size:15px;
  line-height:1.5;
  word-break:break-word;
}

.actions{
  margin-top:14px;
  display:flex;
  gap:10px;
}

.btn{
  border:none;
  border-radius:12px;
  padding:12px 16px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.primary{
  background:var(--accent2);
  color:black;
}

.secondary{
  background:#242424;
  color:white;
}

.controls{
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
}

.control{
  width:64px;
  height:64px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  font-size:22px;
}

.zoom{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  width:220px;
  background:rgba(0,0,0,.55);
  padding:12px;
  border-radius:999px;
  backdrop-filter:blur(10px);
}

.zoom input{
  width:100%;
}

.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1f1f1f;
  border:1px solid var(--line);
  border-radius:999px;
  padding:12px 18px;
  font-size:13px;
  opacity:0;
  transition:.3s;
}

.toast.show{
  opacity:1;
}
</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="app">

  <div class="header">
    <div class="logo">DataMatrix Pro</div>

    <div class="status">
      <div class="dot"></div>
      <span id="statusText">Scanning</span>
    </div>
  </div>

  <div class="viewport">

    <video id="video" autoplay playsinline muted></video>

    <div class="overlay">

      <div class="zoom">
        <input type="range" min="1" max="5" value="1" step="0.1" id="zoomSlider">
      </div>

      <div class="scan-box">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="scan-line"></div>
      </div>

      <div class="result" id="result">
        <div class="result-type" id="resultType">DATA MATRIX</div>
        <div class="result-text" id="resultText"></div>

        <div class="actions">
          <button class="btn primary" id="copyBtn">Kopyala</button>
          <button class="btn secondary" id="openBtn">Aç</button>
        </div>
      </div>

    </div>
  </div>

  <div class="controls">
    <button class="control" id="flipBtn">🔄</button>
    <button class="control" id="startBtn">📷</button>
  </div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script type="module">

import {
  readBarcodes,
  BarcodeFormat
} from "https://cdn.jsdelivr.net/npm/zbar-wasm@0.9.12/+esm";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d",{willReadFrequently:true});

const result = document.getElementById("result");
const resultText = document.getElementById("resultText");

const toast = document.getElementById("toast");

const startBtn = document.getElementById("startBtn");
const flipBtn = document.getElementById("flipBtn");

const copyBtn = document.getElementById("copyBtn");
const openBtn = document.getElementById("openBtn");

const zoomSlider = document.getElementById("zoomSlider");

let stream = null;
let scanning = false;
let facingMode = "environment";

let lastText = null;

function showToast(text){
  toast.textContent = text;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },2000);
}

async function startCamera(){

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  stream = await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:{ideal:facingMode},
      width:{ideal:1920},
      height:{ideal:1080}
    },
    audio:false
  });

  video.srcObject = stream;

  await video.play();

  applyZoom(1);

  scanning = true;

  scanLoop();
}

async function applyZoom(value){

  if(!stream) return;

  const track = stream.getVideoTracks()[0];

  const capabilities = track.getCapabilities?.();

  if(capabilities?.zoom){

    try{
      await track.applyConstraints({
        advanced:[{
          zoom:value
        }]
      });
    }catch(e){}
  }
}

zoomSlider.addEventListener("input",()=>{
  applyZoom(parseFloat(zoomSlider.value));
});

async function scanLoop(){

  if(!scanning) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  canvas.width = vw;
  canvas.height = vh;

  ctx.drawImage(video,0,0,vw,vh);

  const size = Math.min(vw,vh)*0.45;

  const sx = (vw-size)/2;
  const sy = (vh-size)/2;

  const imageData = ctx.getImageData(
    sx,
    sy,
    size,
    size
  );

  try{

    const codes = await readBarcodes(imageData,{
      formats:[
        BarcodeFormat.DataMatrix,
        BarcodeFormat.QRCode
      ]
    });

    if(codes.length){

      const text = codes[0].text;

      if(text !== lastText){

        lastText = text;

        navigator.vibrate?.([50,30,50]);

        result.classList.add("show");

        resultText.textContent = text;

        showToast("Kod okundu");

        setTimeout(()=>{
          lastText = null;
        },2500);
      }
    }

  }catch(err){}

  requestAnimationFrame(scanLoop);
}

copyBtn.addEventListener("click",async()=>{

  await navigator.clipboard.writeText(
    resultText.textContent
  );

  showToast("Kopyalandı");
});

openBtn.addEventListener("click",()=>{

  const text = resultText.textContent;

  if(/^https?:\/\//i.test(text)){
    window.open(text,"_blank");
  }else{
    showToast("Geçerli URL değil");
  }
});

flipBtn.addEventListener("click",async()=>{

  facingMode =
    facingMode === "environment"
    ? "user"
    : "environment";

  await startCamera();
});

startBtn.addEventListener("click",async()=>{

  try{
    await startCamera();
    showToast("Kamera başlatıldı");
  }catch(err){
    showToast(err.message);
  }
});

startCamera();

</script>

</body>
</html>
