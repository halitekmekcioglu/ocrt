<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <title>DataMatrix Scanner</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        video { width: 100vw; height: 100vh; object-fit: cover; position: fixed; inset: 0; }
        #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
        #box { 
            width: 260px; height: 260px; border: 2px solid rgba(79, 195, 255, 0.5); 
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); 
            border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45); 
        }
        .corner { position: absolute; width: 42px; height: 42px; border-color: #7dff95; border-style: solid; }
        .tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
        .tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
        .bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
        .br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }
        #line { position: absolute; left: 0; right: 0; height: 2px; background: #4fc3ff; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        #result { 
            position: fixed; left: 20px; right: 20px; bottom: 20px; background: rgba(20,20,20,.95); 
            color: white; border-radius: 20px; padding: 18px; transform: translateY(150%); 
            transition: .3s; z-index: 100; 
        }
        #result.show { transform: translateY(0); }
        button { margin-top: 14px; border: none; padding: 12px; border-radius: 12px; background: #4fc3ff; font-weight: bold; width: 100%; }
        #status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7); color: white; padding: 10px 20px; border-radius: 999px; z-index: 100; }
        #zoom-container { position: fixed; bottom: 160px; left: 50%; transform: translateX(-50%); z-index: 90; width: 70%; display: none; }
    </style>
</head>
<body>

<div id="status">Başlatılıyor...</div>
<video id="video" playsinline></video>

<div id="overlay">
    <div id="box">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div id="line"></div>
    </div>
</div>

<div id="zoom-container">
    <input type="range" id="zoom-range" min="1" max="1" step="0.1" style="width:100%">
</div>

<div id="result">
    <div id="text"></div>
    <button id="copy">Kopyala</button>
</div>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const zoomRange = document.getElementById('zoom-range');
    const zoomContainer = document.getElementById('zoom-container');
    
    // Hatayı gideren kısım: Instance oluşturuyoruz
    const codeReader = new ZXing.BrowserDatamatrixCodeReader(); 
    let lastText = null;

    async function start() {
        try {
            // Video cihazlarını listele (Yeni versiyonda instance üzerinden)
            const devices = await codeReader.listVideoInputDevices();
            
            const backCamera = devices.find(d => 
                d.label.toLowerCase().includes('back') || 
                d.label.toLowerCase().includes('arka')
            ) || devices[0];

            // Taramayı başlat
            codeReader.decodeFromVideoDevice(backCamera.deviceId, 'video', (result, err) => {
                if (result) {
                    const text = result.getText();
                    if(text !== lastText) {
                        lastText = text;
                        document.getElementById('text').innerText = text;
                        document.getElementById('result').classList.add('show');
                        status.innerHTML = "Kod Okundu";
                        setTimeout(() => { lastText = null; }, 3000);
                    }
                }
            });

            status.innerHTML = "Kamera Hazır";
            
            // Zoom ayarı (iPad Chrome desteği için)
            setTimeout(async () => {
                const stream = video.srcObject;
                if(stream) {
                    const [track] = stream.getVideoTracks();
                    const caps = track.getCapabilities?.();
                    if(caps && caps.zoom) {
                        zoomContainer.style.display = 'block';
                        zoomRange.min = caps.zoom.min;
                        zoomRange.max = caps.zoom.max;
                        zoomRange.step = caps.zoom.step;
                        zoomRange.oninput = () => {
                            track.applyConstraints({ advanced: [{ zoom: zoomRange.value }] });
                        };
                    }
                }
            }, 2000);

        } catch (err) {
            status.innerHTML = "Hata: " + err.message;
            console.error(err);
        }
    }

    document.getElementById('copy').onclick = () => {
        navigator.clipboard.writeText(document.getElementById('text').innerText);
        status.innerHTML = "Kopyalandı!";
        setTimeout(() => { status.innerHTML = "Kamera Hazır"; }, 2000);
    };

    window.onload = start;
</script>

</body>
</html>
