<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DataMatrix Scanner Pro</title>

<style>
:root{
  --bg:#0c0c0c;
  --card:#181818;
  --line:#2e2e2e;
  --accent:#79f28a;
  --accent2:#5fc8ff;
  --text:#f3f3f3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

.header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px;
}

.logo{
  font-size:22px;
  font-weight:700;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:10px 14px;
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{opacity:1}
  50%{opacity:.3}
  100%{opacity:1}
}

.viewport{
  flex:1;
  margin:0 14px;
  position:relative;
  overflow:hidden;
  border-radius:24px;
  border:1px solid var(--line);
  background:black;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.scan-box{
  position:absolute;
  width:260px;
  height:260px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:2px solid rgba(95,200,255,.7);
  border-radius:18px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.45);
}

.corner{
  position:absolute;
  width:42px;
  height:42px;
  border-color:var(--accent);
  border-style:solid;
}

.tl{
  top:-2px;
  left:-2px;
  border-width:4px 0 0 4px;
  border-radius:18px 0 0 0;
}

.tr{
  top:-2px;
  right:-2px;
  border-width:4px 4px 0 0;
}

.bl{
  bottom:-2px;
  left:-2px;
  border-width:0 0 4px 4px;
}

.br{
  bottom:-2px;
  right:-2px;
  border-width:0 4px 4px 0;
}

.scan-line{
  position:absolute;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent2),transparent);
  animation:scan 2s linear infinite;
}

@keyframes scan{
  0%{top:0%}
  100%{top:100%}
}

.result{
  position:absolute;
  left:16px;
  right:16px;
  bottom:16px;
  background:rgba(20,20,20,.96);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  transform:translateY(120%);
  transition:.3s;
  backdrop-filter:blur(20px);
}

.result.show{
  transform:translateY(0);
}

.result-title{
  font-size:11px;
  color:var(--accent2);
  margin-bottom:10px;
  letter-spacing:.12em;
}

.result-text{
  font-size:15px;
  line-height:1.5;
  word-break:break-word;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.btn{
  border:none;
  border-radius:12px;
  padding:12px 16px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:var(--accent2);
  color:black;
}

.secondary{
  background:#242424;
  color:white;
}

.controls{
  padding:20px;
  display:flex;
  justify-content:center;
  gap:18px;
}

.control{
  width:64px;
  height:64px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  font-size:24px;
}

.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1d1d1d;
  border:1px solid var(--line);
  border-radius:999px;
  padding:12px 18px;
  font-size:13px;
  opacity:0;
  transition:.3s;
  z-index:999;
}

.toast.show{
  opacity:1;
}

.zoom{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  width:220px;
  background:rgba(0,0,0,.55);
  padding:12px;
  border-radius:999px;
  backdrop-filter:blur(10px);
}

.zoom input{
  width:100%;
}
</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="app">

  <div class="header">
    <div class="logo">DataMatrix Pro</div>

    <div class="status">
      <div class="dot"></div>
      <span>LIVE</span>
    </div>
  </div>

  <div class="viewport">

    <video id="video" autoplay playsinline muted></video>

    <div class="overlay">

      <div class="zoom">
        <input type="range" min="1" max="5" step="0.1" value="1" id="zoomSlider">
      </div>

      <div class="scan-box">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="scan-line"></div>

      </div>

      <div class="result" id="result">

        <div class="result-title">SCAN RESULT</div>

        <div class="result-text" id="resultText"></div>

        <div class="actions">
          <button class="btn primary" id="copyBtn">Kopyala</button>
          <button class="btn secondary" id="openBtn">Aç</button>
        </div>

      </div>

    </div>

  </div>

  <div class="controls">
    <button class="control" id="flipBtn">🔄</button>
    <button class="control" id="startBtn">📷</button>
  </div>

</div>

<canvas id="canvas" style="display:none"></canvas>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const resultBox = document.getElementById("result");
const resultText = document.getElementById("resultText");

const copyBtn = document.getElementById("copyBtn");
const openBtn = document.getElementById("openBtn");

const startBtn = document.getElementById("startBtn");
const flipBtn = document.getElementById("flipBtn");

const toast = document.getElementById("toast");

const zoomSlider = document.getElementById("zoomSlider");

const ctx = canvas.getContext("2d",{willReadFrequently:true});

const codeReader = new ZXing.BrowserMultiFormatReader();

let stream = null;
let scanning = false;
let facingMode = "environment";
let lastResult = null;

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },2000);
}

async function startCamera(){

  try{

    if(stream){
      stream.getTracks().forEach(t=>t.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:facingMode,
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject = stream;

    video.setAttribute("playsinline", true);

    await video.play();

    applyZoom(1);

    scanning = true;

    scanLoop();

    showToast("Kamera açıldı");

  }catch(err){

    console.error(err);

    showToast("Kamera hatası");
  }
}

async function applyZoom(value){

  if(!stream) return;

  try{

    const track = stream.getVideoTracks()[0];

    const capabilities = track.getCapabilities?.();

    if(capabilities?.zoom){

      await track.applyConstraints({
        advanced:[{
          zoom:value
        }]
      });
    }

  }catch(e){}
}

zoomSlider.addEventListener("input",()=>{
  applyZoom(parseFloat(zoomSlider.value));
});

async function scanLoop(){

  if(!scanning) return;

  try{

    const vw = video.videoWidth;
    const vh = video.videoHeight;

    if(!vw || !vh){
      requestAnimationFrame(scanLoop);
      return;
    }

    canvas.width = vw;
    canvas.height = vh;

    ctx.drawImage(video,0,0,vw,vh);

    const size = Math.min(vw,vh) * 0.45;

    const sx = (vw - size) / 2;
    const sy = (vh - size) / 2;

    const cropCanvas = document.createElement("canvas");

    cropCanvas.width = size;
    cropCanvas.height = size;

    const cropCtx = cropCanvas.getContext("2d");

    cropCtx.drawImage(
      video,
      sx,
      sy,
      size,
      size,
      0,
      0,
      size,
      size
    );

    const result = await codeReader.decodeFromCanvas(cropCanvas);

    if(result){

      const text = result.text;

      if(text !== lastResult){

        lastResult = text;

        navigator.vibrate?.([50,30,50]);

        resultText.textContent = text;

        resultBox.classList.add("show");

        showToast("Kod okundu");

        setTimeout(()=>{
          lastResult = null;
        },2500);
      }
    }

  }catch(err){
  }

  requestAnimationFrame(scanLoop);
}

copyBtn.addEventListener("click",async()=>{

  try{

    await navigator.clipboard.writeText(
      resultText.textContent
    );

    showToast("Kopyalandı");

  }catch(err){}
});

openBtn.addEventListener("click",()=>{

  const text = resultText.textContent;

  if(/^https?:\/\//i.test(text)){
    window.open(text,"_blank");
  }else{
    showToast("URL değil");
  }
});

flipBtn.addEventListener("click",async()=>{

  facingMode =
    facingMode === "environment"
    ? "user"
    : "environment";

  await startCamera();
});

startBtn.addEventListener("click", async ()=>{

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){
    showToast("Kamera desteklenmiyor");
    return;
  }

  await startCamera();
});

</script>

</body>
</html>
