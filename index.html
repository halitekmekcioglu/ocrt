<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <title>DataMatrix Debug Scanner</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        video { width: 100vw; height: 100vh; object-fit: cover; position: fixed; inset: 0; z-index: 1; }
        
        /* Debug Paneli */
        #debug-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 150px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #ff0000;
            color: #0f0;
            font-size: 10px;
            z-index: 200;
            padding: 5px;
            pointer-events: none;
        }
        #debug-canvas { width: 100%; border: 1px solid #555; margin-top: 5px; }

        #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
        #box { 
            width: 240px; height: 240px; border: 2px solid rgba(79, 195, 255, 0.5); 
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); 
            border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .6); 
        }
        #line { position: absolute; left: 0; right: 0; height: 2px; background: #ff0000; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        #status { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,.8); color: white; padding: 8px 15px; border-radius: 5px; z-index: 100; font-size: 12px; }
        
        #result { 
            position: fixed; left: 20px; right: 20px; bottom: 100px; background: #fff; 
            color: #000; border-radius: 10px; padding: 15px; transform: translateY(200%); 
            transition: .3s; z-index: 300; 
        }
        #result.show { transform: translateY(0); }
        
        #zoom-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 400; width: 80%; }
        input[type=range] { width: 100%; height: 30px; }
    </style>
</head>
<body>

<div id="debug-panel">
    <div>ANALİZ EDİLEN:</div>
    <canvas id="debug-canvas"></canvas>
    <div id="log" style="height: 60px; overflow: hidden; margin-top:5px;">Bekleniyor...</div>
</div>

<div id="status">Sistem başlatılıyor...</div>
<video id="video" playsinline></video>

<div id="overlay">
    <div id="box"><div id="line"></div></div>
</div>

<div id="zoom-container">
    <input type="range" id="zoom-range" min="1" max="1" step="0.1" value="1">
</div>

<div id="result">
    <b style="font-size:12px; color: #666;">OKUNAN VERİ:</b>
    <div id="text" style="font-weight:bold; margin: 10px 0; word-break: break-all;"></div>
    <button onclick="copyText()" style="width:100%; padding: 10px; background: #007aff; color: #fff; border:none; border-radius:5px;">Kopyala</button>
</div>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const log = document.getElementById('log');
    const debugCanvas = document.getElementById('debug-canvas');
    const dctx = debugCanvas.getContext('2d');
    const zoomRange = document.getElementById('zoom-range');
    
    // MultiFormat kullanıyoruz çünkü DataMatrix hassastır
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let lastText = null;

    async function start() {
        try {
            const devices = await codeReader.listVideoInputDevices();
            const backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('arka')) || devices[0];

            // Taramayı başlat (Saniyede 4-5 kez dener)
            codeReader.decodeFromVideoDevice(backCamera.deviceId, 'video', (result, err) => {
                // Her denemede debug canvas'ı güncelle
                updateDebugCanvas();

                if (result) {
                    const text = result.getText();
                    if(text !== lastText) {
                        lastText = text;
                        document.getElementById('text').innerText = text;
                        document.getElementById('result').classList.add('show');
                        log.innerHTML = "<span style='color:cyan'>KOD BULUNDU!</span>";
                        navigator.vibrate?.(100);
                        setTimeout(() => { lastText = null; }, 3000);
                    }
                }
                if (err && !(err instanceof ZXing.NotFoundException)) {
                    log.innerHTML = "Hata: " + err.message;
                } else {
                    log.innerHTML = "Aranıyor... (Karekod hizalayın)";
                }
            });

            status.innerHTML = "Kamera Hazır - Yakınlaştırıp Odaklayın";
            setupZoom();

        } catch (err) {
            status.innerHTML = "Başlatma Hatası: " + err;
        }
    }

    function updateDebugCanvas() {
        // Videodan kareyi alıp debug kutusuna çiz (Görmek için)
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            const size = 300; // Analiz edilen kare boyutu
            debugCanvas.width = size;
            debugCanvas.height = size;
            
            // Videonun ortasından bir kare kesiyoruz
            const startX = (video.videoWidth / 2) - (size / 2);
            const startY = (video.videoHeight / 2) - (size / 2);

            dctx.drawImage(video, startX, startY, size, size, 0, 0, size, size);
        }
    }

    async function setupZoom() {
        setTimeout(async () => {
            const stream = video.srcObject;
            if(!stream) return;
            const [track] = stream.getVideoTracks();
            const caps = track.getCapabilities?.();
            
            if(caps && caps.zoom) {
                zoomRange.min = caps.zoom.min;
                zoomRange.max = caps.zoom.max;
                zoomRange.step = caps.zoom.step;
                zoomRange.oninput = () => {
                    track.applyConstraints({ advanced: [{ zoom: zoomRange.value }] });
                    status.innerHTML = "Zoom: x" + zoomRange.value;
                };
            } else {
                status.innerHTML = "Zoom desteklenmiyor (iOS Safari/Chrome sınırlı)";
            }
        }, 2000);
    }

    function copyText() {
        navigator.clipboard.writeText(document.getElementById('text').innerText);
        alert("Kopyalandı!");
        document.getElementById('result').classList.remove('show');
    }

    window.onload = start;
</script>

</body>
</html>
